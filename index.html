<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cennik Botów Discord - Metis Community</title>
    <meta name="description" content="Prosty i przejrzysty cennik botów Discord od Metis Community. Sprawdź pakiety i ceny modułów.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="main-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h1 class="brand-name">METIS <span>BOTS</span></h1>
                    <p class="brand-subtitle">Cennik Botów & Modułów Discord</p>
                </div>
            </div>
            <a href="https://discord.gg/" target="_blank" class="discord-btn">
                <i class="fa-brands fa-discord"></i> Dołącz na Discorda
            </a>
        </header>

        <!-- Category Filter Tabs -->
        <nav class="filters">
            <button class="filter-tab active" data-category="all">Wszystkie</button>
            <button class="filter-tab" data-category="welcome">Powitania & Boost</button>
            <button class="filter-tab" data-category="tickets">Tickety</button>
            <button class="filter-tab" data-category="giveaway">Giveaway</button>
            <button class="filter-tab" data-category="security">Weryfikacja & Ochrona</button>
            <button class="filter-tab" data-category="economy">Ekonomia & Gry</button>
            <button class="filter-tab" data-category="other">Inne</button>
        </nav>

        <!-- Compact Paired Pricing Grid -->
        <main class="pricing-container" id="pricing-container">
            <!-- Dynamic 2-Column Paired Cards -->
        </main>

        <!-- Bonus Banner -->
        <div class="simple-banner">
            <div class="banner-icon"><i class="fa-solid fa-gift"></i></div>
            <span><strong>Stickymessages GRATIS</strong> przy każdym zamówieniu od 10 zł!</span>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Metis Community &bull; Zamówienia realizowane na serwerze Discord</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
